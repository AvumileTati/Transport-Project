window.initGoogleMap = function(){
  if(!document.getElementById("miniMap")) return;
  const mapEl=document.getElementById("miniMap");
  map=new google.maps.Map(mapEl,{center:{lat:-33.9249,lng:18.4241},zoom:11,disableDefaultUI:true});

  const pickupField=document.getElementById("pickupInput");
  if(pickupField){
    pickupAutocomplete=new google.maps.places.Autocomplete(pickupField,{types:["address"],componentRestrictions:{country:"za"}});
    pickupAutocomplete.addListener("place_changed",()=>updateMapRoute());

  }

  if(q1){

  const q2=document.getElementById("q2");

    q2.addEventListener("input",()=>updateMapRoute());
  }
  updateMapRoute();
};
function updateMapRoute(){
  if(!map || !directionsService || !directionsRenderer) return;
  const pickupField=document.getElementById("pickupInput");
  const start = pickupField && pickupField.value ? pickupField.value.trim() : (document.getElementById("q1")?.value || "").trim();
  const destinationField=document.getElementById("q2");
  const end = destinationField && destinationField.value ? destinationField.value.trim() : "Sunridge Primary";
  if(!start || !end){
    directionsRenderer.setDirections({routes:[]});
    return;
  }
  directionsService.route({origin:start,destination:end,travelMode:google.maps.TravelMode.DRIVING},(result,status)=>{
     if(status === "OK") directionsRenderer.setDirections(result);
     else directionsRenderer.setDirections({routes:[]});
  });
}

<div class="section">
  <h2>Frequently asked questions</h2>
  <div class="faq-list">
    <details open><summary>Can I request a custom route?</summary><p>Yes. The driver or admin can approve a route based on your pickup area, school, or workplace.</p></details>
    <details><summary>Is it only for school transport?</summary><p>No. The platform supports school transport, staff shuttles, and recurring commuter routes.</p></details>
    <details><summary>How quickly will I get a response?</summary><p>Drivers typically confirm bookings within a few hours, depending on route demand and pickup schedule.</p></details>
    <details><summary>Can I book more than one seat?</summary><p>Absolutely. You can request multiple seats and the driver will confirm available capacity.</p></details>
  </div>
</div>
<section class="hero" style="margin-top:16px"><h1>${t("findRoute")}</h1>
<div class="chips" role="group" aria-label="Transport type">${Object.entries(TY).map(([k,v])=>`<button data-type="${k}" aria-pressed="${k===st.type}">${v}</button>`).join("")}</div>
<label>${t("pickupArea")}<input id="q1" placeholder="${t("pickupPlaceholder")}" autocomplete="off"></label>
<label>${t("schoolWorkplace")}<input id="q2" placeholder="${t("destPlaceholder")}" autocomplete="off"></label></section>
<h2>${t("availableNow")}</h2><div id="res" class="list"></div><h2>${t("yourRequests")}</h2><div id="mine" class="list"></div>`,
driver:()=>`<section class="hero"><h1>Put your vehicle to work</h1><p>Add your car or minibus. Once the admin approves it, families and staff can request seats.</p>
<form id="vf" class="fg">
<label>Your name<input name="driver" required></label><label>Phone<input name="phone" type="tel" required></label>
<label>Vehicle<input name="car" placeholder="Toyota Quantum" required></label><label>Number plate<input name="plate" required></label>
<label>Passenger seats<input name="seats" type="number" min="1" max="60" required></label>
<label>Service<select name="type"><option value="school">School run</option><option value="staff">Staff shuttle</option></select></label>
<label>Area you pick up from<input name="area" placeholder="Claremont" required></label><label>School or workplace<input name="dest" placeholder="Sunridge Primary" required></label>
<label>Price per seat, per month (R)<input name="price" type="number" min="0" required></label>
<label>Years of experience<input name="experience" type="number" min="0" max="30" value="1"></label>
<label>Service days<input name="serviceDays" placeholder="Mon-Fri" required></label>
<label>Vehicle features<input name="features" placeholder="AC, booster seats, tracking"></label>
<div class="row" style="align-items:end"><button class="btn">Submit for approval</button></div></form></section>
<h2>Your vehicles</h2><div id="myv" class="list"></div><h2>Seat requests</h2><div id="myb" class="list"></div>`,
admin:()=>st.admin?`<h1>Control room</h1><div id="stats" class="stats"></div><h2>Vehicles awaiting approval</h2><div id="qv" class="list"></div><h2>Seat requests</h2><div id="qb" class="list"></div><h2>Live vehicles</h2><div id="lv" class="list"></div>`:`<div class="empty">The admin portal is for the transport coordinator. Ask the owner of this page for Editor access.</div>`};
function shell(){$("#app").innerHTML=V[st.role]();document.querySelectorAll("[data-role]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.role===st.role));$("#mode").textContent=st.db?"Live and shared with everyone who has access.":"Demo mode: saved in this browser only.";paint()}
function paint(){const r=st.role,q1=($("#q1")?.value||"").toLowerCase().trim(),q2=($("#q2")?.value||"").toLowerCase().trim(),put=(id,h)=>{const e=$("#"+id);if(e)e.innerHTML=h},all=st.vehicles,ok=all.filter(v=>v.status==="approved");
 if(r==="passenger"){
  const m=ok.filter(v=>v.type===st.type&&(!q1||String(v.area).toLowerCase().includes(q1))&&(!q2||String(v.dest).toLowerCase().includes(q2)));
  put("res",list(m,v=>vc(v,`<span class="tag">${left(v)} left</span><button class="btn" data-act="req" data-id="${esc(v.id)}" ${left(v)<1?"disabled":""}>${left(v)<1?t("full"):t("requestSeats")}</button>`,`Driver ${esc(String(v.driver).split(" ")[0])} · approved by admin`),"No vehicles match yet. Try a wider area, or check back as drivers join."));
  put("mine",list(own(st.bookings,"uid"),b=>bc(b,""),"Seats you request will show up here."))}
 if(r==="driver"){
  put("myv",list(own(all,"uid"),v=>vc(v,`<span class="tag ${(VL[v.status]||VL.pending)[1]}">${(VL[v.status]||VL.pending)[0]}</span>`,esc(v.plate)),"Vehicles you add will show up here."));
  put("myb",list(st.bookings.filter(b=>b.duid===st.uid).sort((a,b)=>b.ts-a.ts),b=>bc(b,acts(b)),"Requests for your vehicles will show up here."))}
 if(r==="admin"&&st.admin){
  const pend=all.filter(v=>v.status==="pending");
  const monthlyValue=ok.reduce((sum,v)=>sum+n(v.price)*n(v.seats),0);
  put("stats",[["Live vehicles",ok.length],["Awaiting approval",pend.length],["Open requests",st.bookings.filter(b=>b.status==="requested").length],["Monthly value",R(monthlyValue)]].map(([l,x])=>`<div class="card"><b class="big">${x}</b><small>${l}</small></div>`).join(""));
  put("qv",list(pend,v=>vc(v,`<button class="btn" data-act="ok" data-id="${esc(v.id)}">Approve</button><button class="btn bad" data-act="no" data-id="${esc(v.id)}">Reject</button>`,info(v)),"Nothing waiting. New vehicles from drivers land here."));
  put("qb",list([...st.bookings].sort((a,b)=>b.ts-a.ts),b=>bc(b,acts(b)),"No seat requests yet."));
  put("lv",list(ok,v=>vc(v,`<span class="tag">${left(v)} seats left</span><button class="btn bad" data-act="rm" data-id="${esc(v.id)}">Remove</button>`,info(v)),"No live vehicles yet."))}}
document.addEventListener("click",e=>{
 const langBtn=e.target.closest(".lang-btn"); if(langBtn){ st.lang=langBtn.dataset.lang; applyLanguage(); shell(); return; }
 const themeBtn=e.target.closest("#themeToggle"); if(themeBtn){ st.theme=st.theme==="dark"?"light":"dark"; applyTheme(); return; }
 const r=e.target.closest("[data-role]");if(r){st.role=r.dataset.role;shell();return}
 const t=e.target.closest("[data-type]");if(t){st.type=t.dataset.type;document.querySelectorAll("[data-type]").forEach(b=>b.setAttribute("aria-pressed",b===t));paint();return}
 const a=e.target.closest("[data-act]");if(!a)return;const id=a.dataset.id,c=a.dataset.act;
 if(c==="pay"){const b=st.bookings.find(x=>x.id===id);if(b&&b.status==="confirmed"&&b.paymentStatus!=="demo-paid"){$("#payBookingId").value=id;$("#paySummary").innerHTML=`<b>${esc(b.vlabel)}</b><span>${n(b.seats)} seat${n(b.seats)>1?"s":""} × ${R(unitPrice(b))} per month</span><strong>Total ${R(paymentTotal(b))} per month</strong>`;PD.showModal()}return}
 if(c==="payClose"){PD.close();return}
 if(c==="ok"||c==="no")patch("vehicles",id,{status:c==="ok"?"approved":"rejected"});
 if(c==="cf"||c==="dc")patch("bookings",id,{status:c==="cf"?"confirmed":"declined"});
 if(c==="rm")del("vehicles",id);
 if(c==="x")D.close();
 if(c==="req"){const v=st.vehicles.find(x=>x.id===id);if(v){D.dataset.vid=id;$("#dt").textContent=`${v.car} · ${v.area} to ${v.dest}`;$("#bf").elements.seats.max=left(v);const pickupField=document.getElementById("pickupInput");if(pickupField){pickupField.value = "";}updateMapRoute();D.showModal();}}});
document.addEventListener("input",e=>{if(e.target.id==="q1"||e.target.id==="q2")paint(); if(e.target.id==="pickupInput"||e.target.id==="q1"||e.target.id==="q2") updateMapRoute();});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
 if(f.id==="payForm"){if(st.db){toast("Demo checkout is unavailable while connected to live data.");return}const id=$("#payBookingId").value,b=st.bookings.find(x=>x.id===id);if(!b||b.status!=="confirmed"){PD.close();toast("This booking is not ready for payment.");return}await patch("bookings",id,{paymentStatus:"demo-paid",paymentMethod:d.method,demoPaidAt:Date.now()});PD.close();toast("Demo payment recorded. No money was charged.");return}
 if(f.id==="vf"&&await add("vehicles",{...d,seats:n(d.seats),price:n(d.price),experience:n(d.experience),status:"pending"})){f.reset();toast("Submitted. The admin will review your vehicle.")}
 if(f.id==="bf"){const v=st.vehicles.find(x=>x.id===D.dataset.vid);if(v&&await add("bookings",{...d,seats:n(d.seats),date:d.date,pickupTime:d.pickupTime,vid:v.id,duid:v.uid,vlabel:`${v.car} (${v.area})`,dest:v.dest,monthlyPrice:n(v.price),paymentStatus:"unpaid",status:"requested"})){D.close();f.reset();toast("Request sent. The driver will confirm.")}}});
load();applyTheme();applyLanguage();shell();loadGoogleMaps();
(async()=>{try{const c=window.claude;if(!c)return;const[db,u]=await Promise.all([c.use("db"),c.use("user")]);if(!db)return;
 st.db=db;st.vehicles=[];st.bookings=[];if(u){st.uid=(await u.id())||"anon";st.admin=await u.canEdit()}
 ["vehicles","bookings"].forEach(k=>db.collection(k).onSnapshot(s=>{st[k]=s.docs.map(d=>({...d.data(),id:d.id}));paint()},()=>toast("Live updates paused")));shell()}catch(e){}})();
</script></body></html>
